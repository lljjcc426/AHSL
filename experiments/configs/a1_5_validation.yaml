experiment_type: a1_5_validation
m: 7
rows_per_case: 4
tree_topologies: [random, path, balanced, star]
branch_probabilities: [0.1, 0.2, 0.4, 0.6, 0.8, 0.9]
noise_settings:
  - name: zero
    p_false_positive: 0.0
    p_false_negative: 0.0
  - name: symmetric
    p_false_positive: 0.2
    p_false_negative: 0.2
  - name: asymmetric
    p_false_positive: 0.1
    p_false_negative: 0.3
repetitions: [1, 3]
seeds: [0, 1, 2]
comparison_tolerance: 1.0e-10
